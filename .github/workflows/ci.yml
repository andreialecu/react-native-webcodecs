name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The release dry run checks that it could push the release commit.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn tsc

      - name: Unit tests
        run: yarn test:unit

      # The Android C++ helpers that need no NDK, under ASan and UBSan.
      - name: C++ host tests
        run: yarn test:cpp

      - name: Build the package
        run: yarn build

      # The generated Nitro sources are committed: fail when they are stale.
      - name: Check Nitro specs
        run: yarn specs && git diff --exit-code -- nitrogen

      # Validate the semantic-release config without publishing, so a broken
      # .releaserc is caught on main rather than at release time. Not on pull
      # requests: a fork's token cannot push, and the dry run checks that.
      - name: Release dry run
        if: github.event_name != 'pull_request'
        run: yarn semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ''
          NPM_TOKEN: ''

  # Builds the example, runs it on a simulator and runs the e2e tests against
  # it (src/__tests__): exports checked with ffprobe and
  # ffmpeg on the host.
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      METRO_PORT: 8081
      E2E_PORT: 4242
      IOS_SIMULATOR: webcodecs-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Most of installing ffmpeg is downloading its bottles and those of its
      # dependencies. They are kept between runs, keyed on the runner image
      # and the ffmpeg version Homebrew would install, so a new image or a new
      # ffmpeg starts from an empty download cache. brew still installs from
      # them and checks their checksums.
      - name: Find ffmpeg version
        id: ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          {
            echo "version=$(brew info --json=v2 ffmpeg | jq -r '.formulae[0].versions.stable')"
            echo "dir=$(brew --cache)/downloads"
            echo "image=$ImageOS-$ImageVersion"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Homebrew downloads
        id: brew
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.ffmpeg.outputs.dir }}
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg.outputs.image }}-ffmpeg-${{ steps.ffmpeg.outputs.version }}

      - name: Install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: command -v ffprobe >/dev/null || brew install ffmpeg

      - name: Save Homebrew downloads
        if: steps.brew.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.ffmpeg.outputs.dir }}
          key: ${{ steps.brew.outputs.cache-primary-key }}

      # xcpretty is a gem, not part of the macOS runner image.
      - name: Install xcpretty
        run: command -v xcpretty >/dev/null || sudo gem install xcpretty --no-document

      # The compilation cache is only valid for the Xcode that wrote it. It
      # lives outside the checkout so that Jest and ESLint never walk it.
      - name: Show Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
          echo "XCODE_CAS=$RUNNER_TEMP/xcode-cas" >> "$GITHUB_ENV"

      # Pods holds the React Native, Hermes and Skia prebuilts unpacked, which
      # is most of pod install's time. pod install still runs and brings Pods
      # in line with the Podfile when anything differs.
      - name: Restore Pods
        id: pods
        uses: actions/cache/restore@v4
        with:
          path: example/ios/Pods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('example/ios/Podfile', 'example/ios/Podfile.lock', 'yarn.lock') }}

      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install

      - name: Save Pods
        if: steps.pods.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: example/ios/Pods
          key: ${{ steps.pods.outputs.cache-primary-key }}

      # Asks Metro for the bundle the app will load while Xcode builds, so the
      # first launch does not wait for it. The URL is the one the debug app
      # requests; a different one would bundle with other options and warm
      # nothing.
      - name: Start Package Manager
        working-directory: example
        run: |
          CI=true yarn start --port "$METRO_PORT" --reset-cache &
          (
            until curl -sf "http://localhost:$METRO_PORT/status" > /dev/null; do sleep 1; done
            curl -sf -o /dev/null "http://localhost:$METRO_PORT/index.bundle?platform=ios&dev=true&lazy=true&minify=false&inlineSourceMap=false&modulesOnly=false&runModule=true&excludeSource=true&sourcePaths=url-server&app=com.reactnativewebcodecs.example"
          ) > /dev/null 2>&1 &

      # Xcode's compilation cache stores each compile's output under a hash of
      # all its inputs (sources, headers, flags, compiler), so a stale entry is
      # never used: anything that changed is a miss and compiles as usual.
      - name: Restore compilation cache
        id: cas
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.XCODE_CAS }}
          key: xcode-cas-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('example/ios/Podfile.lock', 'yarn.lock') }}
          restore-keys: |
            xcode-cas-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      # The runner is Apple silicon, so only arm64 is built: the generic
      # destination alone would build x86_64 as well. The raw log is kept to
      # count the compilation cache hits.
      - name: Build example for iOS
        working-directory: example/ios
        run: |
          set -o pipefail && xcodebuild \
            -workspace Example.xcworkspace \
            -scheme Example \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            ARCHS=arm64 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$XCODE_CAS" \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | xcpretty
          echo "Compilation cache: $(grep -c '^Cache hit' "$RUNNER_TEMP/xcodebuild.log") hits, $(grep -c '^Cache miss' "$RUNNER_TEMP/xcodebuild.log") misses, $(du -sh "$XCODE_CAS" | cut -f1)"

      # Saved right after the build, so a failing e2e run still keeps it.
      - name: Save compilation cache
        if: steps.cas.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.XCODE_CAS }}
          key: ${{ steps.cas.outputs.cache-primary-key }}

      # Booted only now, not in the background during the earlier steps: on
      # the runner a booting simulator slowed the steps running beside it for
      # minutes (unpacking Node.js went from 5 s to over a minute), more than
      # the boot itself takes.
      - name: Prepare iOS simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes available --json | jq -r '
            .runtimes | map(select(.platform == "iOS"))
            | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
          DEVICE_TYPE=$(xcrun simctl list devicetypes --json | jq -r '
            .devicetypes | map(select(.name | test("^iPhone [0-9]+ Pro$")))
            | sort_by(.name | capture("^iPhone (?<n>[0-9]+) Pro$").n | tonumber) | last | .identifier')
          UDID=$(xcrun simctl create "$IOS_SIMULATOR" "$DEVICE_TYPE" "$RUNTIME")
          echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install and launch app on Simulator
        run: |
          xcrun simctl install "$IOS_SIMULATOR_UDID" example/ios/build/Build/Products/Debug-iphonesimulator/ReactTestApp.app
          xcrun simctl launch "$IOS_SIMULATOR_UDID" com.reactnativewebcodecs.example \
            -RCT_jsLocation "localhost:$METRO_PORT"

      - name: Run e2e tests
        run: yarn test
